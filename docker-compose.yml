services:
  ai-analyser:
    image: my-ai-model-env
    # Пробрасываем сетевой мост: порт 8000 на вашем Mac связывается с портом 8000 в контейнере
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    # Команда запускает полноценный веб-сервер uvicorn внутри контейнера
    command: uvicorn script:app --host 0.0.0.0 --port 8000 --reload
